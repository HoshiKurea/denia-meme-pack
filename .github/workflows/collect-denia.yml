name: Build Denia resource pack
on:
  push:
    branches: [asset-staging]
    paths:
      - '.github/workflows/collect-denia.yml'
      - 'tools/denia_pipeline.py'
      - 'tools/prepare_volumes.py'
      - 'tools/curation.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: denia-assets
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: asset-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5 Pillow==11.3.0 jsonschema==4.25.1
      - name: Configure task commits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Collect or finalize images
        id: build
        continue-on-error: true
        env:
          DENIA_CI: '1'
        run: python -u tools/denia_pipeline.py
      - name: Prepare and validate installable volumes
        if: steps.build.outcome == 'success' && hashFiles('tools/curation.json') != ''
        run: python -u tools/prepare_volumes.py
      - name: Save verified checkpoint
        if: always()
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Update Denia resource pack assets and indexes'
            git push origin HEAD:asset-staging
          fi
      - name: Report collection failure
        if: steps.build.outcome != 'success'
        run: exit 1
